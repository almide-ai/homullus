[package]
name = "homullus"
version = "0.1.0"
description = "Modular AI agent CLI runtime, written in Almide"

[dependencies]
almai = { git = "https://github.com/almide-ai/almai.git" }

# Dialect epoch 15 (#4093): a git dependency outside github.com/almide is fetched only
# from an owner the root manifest trusts.
[trust]
owners = ["github.com/almide-ai"]
